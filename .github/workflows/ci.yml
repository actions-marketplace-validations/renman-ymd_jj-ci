name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The "ci" stage, over the checked-out state. actions/checkout fetches one
  # commit unless told otherwise, and that is the right amount here: these
  # checks judge a tree, not a history.
  #
  # jj-ci's own checks are sub-second, so fanning them out over five runners
  # would cost far more than it saves. One job, the action's default path.
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # The ubuntu image ships shellcheck and the macOS one does not. Under
      # strict, a check that cannot run is a failure, so it is installed rather
      # than skipped.
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - uses: ./

  # `uses: ./` runs the action straight out of the workspace. Everyone else gets
  # it as a separate download, where $GITHUB_ACTION_PATH points elsewhere and
  # bin/jj-ci arrives as a copy rather than a symlink. That is the path worth
  # proving, and the only one that caught that copy.
  consumer:
    name: as a published action
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: renman-ymd/jj-ci@main

  # The one job that needs history, and the reason it is a job of its own: a
  # description belongs to a commit, so this is the only stage here with
  # anything to say about a range.
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./
        with:
          stage: commits

  # The fan-out path this repository does not itself use. Without this it would
  # ship having never run.
  plan:
    name: plan emits a usable matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - id: plan
        uses: ./plan

      - name: The matrix matches what .jj-ci.toml declares
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          COUNT: ${{ steps.plan.outputs.count }}
          REVISIONS: ${{ steps.plan.outputs.revisions }}
        run: |
          set -euo pipefail

          # Re-derived from the file by a different route than the one under
          # test: this reads the TOML directly, plan goes through jj-ci's own
          # config loader. Agreeing means something; pinning a number would not.
          # nu is on PATH because the plan action put it there.
          expected=$(nu --no-config-file -c \
            'open --raw .jj-ci.toml | from toml | get checks | transpose name c
             | where { |r| "ci" in ($r.c | get -o stages | default ["push"]) }
             | get name | sort | str join ","')

          got=$(echo "$MATRIX" | jq -r '[.[].check] | sort | join(",")')

          test "$got" = "$expected" ||
            { echo "::error::plan listed [$got], the policy declares [$expected]"; exit 1; }

          echo "$MATRIX" | jq -e 'length > 0' >/dev/null
          echo "$MATRIX" | jq -e 'all(.[]; has("check") and has("doc"))' >/dev/null
          test "$COUNT" = "$(echo "$MATRIX" | jq 'length')"
          test -n "$REVISIONS"

          echo "stage ci: [$got] over $REVISIONS"
